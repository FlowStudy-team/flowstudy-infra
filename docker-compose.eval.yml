services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_eval_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:6333/readyz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  qdrant_eval_data:
