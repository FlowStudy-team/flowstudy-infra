name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

jobs:
  infra-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose template
        run: |
          docker compose --project-directory . --env-file deploy/env.example -f deploy/docker-compose.prod.yml config >/tmp/flowstudy-compose.yml

      - name: Validate shell scripts
        run: |
          bash -n deploy/deploy.sh

      - name: Validate workflow YAML
        run: |
          python -m pip install --disable-pip-version-check --quiet pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in Path(".github/workflows").glob("*.yml"):
              with path.open("r", encoding="utf-8") as f:
                  yaml.safe_load(f)
              print(f"ok: {path}")
          PY

      - name: Check required deployment docs
        run: |
          test -f docs/deployment/ecs-cicd.md
          test -f deploy/env.example
          test -f deploy/nginx/flowstudy.conf

      - name: Check retired names
        run: |
          if grep -Rni "[b]ytesibyl" . --exclude-dir=.git; then
            echo "Retired project name must not appear in flowstudy-infra deployment files." >&2
            exit 1
          fi
