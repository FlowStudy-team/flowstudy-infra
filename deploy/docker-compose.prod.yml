name: flowstudy

services:
  nginx:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/nginx:1.27-alpine
    container_name: flowstudy-nginx
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started
      server:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/flowstudy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - flowstudy-net

  web:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/flowstudy-web:${WEB_IMAGE_TAG}
    container_name: flowstudy-web
    restart: unless-stopped
    networks:
      - flowstudy-net

  server:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/flowstudy-server:${SERVER_IMAGE_TAG}
    container_name: flowstudy-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      JUDGE_SUBMISSION_QUEUE: ${JUDGE_SUBMISSION_QUEUE:-flowstudy.judge.submission.v3}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_SECONDS: ${JWT_EXPIRE_SECONDS:-7200}
      OPENCODE_BASE_URL: http://opencode-fixed:4096
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-flowstudy-content}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-mock}
      OBS_BUCKET: ${OBS_BUCKET:-}
      OBS_ENDPOINT: ${OBS_ENDPOINT:-https://obs.cn-east-3.myhuaweicloud.com}
      OBS_REGION: ${OBS_REGION:-cn-east-3}
      OBS_ACCESS_KEY: ${OBS_ACCESS_KEY:-}
      OBS_SECRET_KEY: ${OBS_SECRET_KEY:-}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_STORE_ORDER_PER_WINDOW: ${RATE_LIMIT_STORE_ORDER_PER_WINDOW:-5}
      AGENT_RUNTIME_BASE_URL: http://agent-runtime:8090
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-}
    expose:
      - "8080"
    networks:
      - flowstudy-net

  agent-runtime:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/flowstudy-agent-runtime:${AGENT_RUNTIME_IMAGE_TAG:-latest}
    container_name: flowstudy-agent-runtime
    profiles:
      - agent-runtime
    restart: unless-stopped
    environment:
      PORT: 8090
      AGENT_RUNTIME_TOKEN: ${AGENT_RUNTIME_TOKEN:-}
      FLOWSTUDY_CORE_BASE_URL: http://server:8080
      DSH_COMMAND: ${DSH_COMMAND:-dsh}
      DSH_PROFILE: ${DSH_PROFILE:-headless}
      DSH_TIMEOUT_MS: ${DSH_TIMEOUT_MS:-120000}
      DSH_MODEL: ${DSH_MODEL:-}
    expose:
      - "8090"
    networks:
      - flowstudy-net

  mysql:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/mysql:8.4
    container_name: flowstudy-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - flowstudy-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - flowstudy-net

  redis:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/redis:7-alpine
    container_name: flowstudy-redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - flowstudy-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - flowstudy-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: flowstudy-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: ${ELASTICSEARCH_JAVA_OPTS:--Xms1g -Xmx1g}
    volumes:
      - flowstudy-es-data:/usr/share/elasticsearch/data
    expose:
      - "9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - flowstudy-net

  rabbitmq:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/rabbitmq:3.13-management-alpine
    container_name: flowstudy-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - flowstudy-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - flowstudy-net

  judge:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/flowstudy-judge:${JUDGE_IMAGE_TAG}
    container_name: flowstudy-judge
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./judge/config.json:/app/config.json:ro
    privileged: true
    networks:
      - flowstudy-net

  opencode-fixed:
    image: ${SWR_REGISTRY}/${SWR_NAMESPACE}/flowstudy-runtime-node20-opencode:${OPENCODE_IMAGE_TAG}
    container_name: flowstudy-opencode-fixed
    restart: unless-stopped
    expose:
      - "4096"
    networks:
      - flowstudy-net

volumes:
  flowstudy-mysql-data:
  flowstudy-redis-data:
  flowstudy-rabbitmq-data:
  flowstudy-es-data:

networks:
  flowstudy-net:
    name: flowstudy-net
